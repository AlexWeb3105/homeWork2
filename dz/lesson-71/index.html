<!DOCTYPE html>
<html lang="en">

	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="stylesheet" href="./style/normalize.css">
		<link rel="stylesheet" href="./style/style.css">
		<title>Стилизация форм и чекбокса</title>
	</head>

	<body>
		<form class="form">
			<fieldset class="data-user">
				<legend class="data-user__title">
					Ваши личные данные
				</legend>
				<label for="name">Ваше имя
					<input class="input" id="name" class="user" type="text" placeholder="Имя" required name="text">
				</label></h3>
				<label for="age">Ваш возраст
					<input class="input" id="age" class="user" type="number" placeholder="Возраст" required name="age">
				</label>
				<label for="phone">Ваш номер телефона
					<input class="input" id="phone" class="user" type="tel" placeholder="Телефон" required name="phone">
				</label>
				<label for="email">Ваша почта
					<input class="input" id="email" class="user" type="email" placeholder="Почта" required name="email">
				</label>
			</fieldset>
			<fieldset class="data-message">
				<label for="message" class="message-title">Сообщение
					<textarea id="message" name="message" placeholder="Введите ваше сообщение..."></textarea>
				</label>
				<label class="checkbox-label">
					<input class="check" type="checkbox" required> Я принимаю правила
				</label>
			</fieldset>
			<button class="button" type="submit">Отправить</button>
		</form>
	</body>

</html>
